; Wasteland Storms settings. The preset is also changed in game with the hotkey.
[WastelandStorms]
; Off, Frequent, Uncommon or Random
Preset=Frequent
; Key that cycles the presets, as a Windows virtual-key code (0x74 = F5, 0x75 = F6, ...)
Hotkey=0x74
; Show the current preset on screen when you enter the open world (1 = yes, 0 = no)
StartupNotice=1
